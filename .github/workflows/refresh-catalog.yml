name: Refresh furniture catalog
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python import_catalog.py
      - name: Commit refreshed catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/catalog.json dist/catalog.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Office Crave furniture catalog'
            git push
          fi
