name: Storefront and payment checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  shop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check dist/app.js
      - run: node --check server/index.mjs
      - run: npm test
